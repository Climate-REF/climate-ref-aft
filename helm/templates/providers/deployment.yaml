{{- include "ref.validateOrchestrator" . -}}
{{- range $instance, $spec := (fromYaml (include "ref.workerInstances" .)) -}}
{{- $spec := include "ref.providerSpec" (dict "root" $ "spec" $spec) | fromYaml -}}
{{- /* The instance name is the deployment identity, the provider is what the worker runs. */ -}}
{{- $provider := $spec.provider | default $instance -}}
{{- $args := list "celery" "start-worker" "--loglevel" "DEBUG" -}}
{{- if ne $provider "orchestrator" -}}
  {{- $args = concat $args (list "--provider" $provider) -}}
{{- end -}}
{{- /* Celery worker options passed after the `--` separator (e.g. --concurrency, --pool). */ -}}
{{- $workerArgs := list -}}
{{- if $spec.concurrency -}}
  {{- $workerArgs = append $workerArgs (printf "--concurrency=%v" $spec.concurrency) -}}
{{- end -}}
{{- /* A repeated --queues wins over the one start-worker derives from the provider,
       so this must precede extraArgs to stay overridable. */ -}}
{{- with $spec.queues -}}
  {{- $workerArgs = append $workerArgs (printf "--queues=%s" (join "," .)) -}}
{{- end -}}
{{- with $spec.extraArgs -}}
  {{- $workerArgs = concat $workerArgs . -}}
{{- end -}}
{{- if $workerArgs -}}
  {{- $args = concat $args (list "--") $workerArgs -}}
{{- end -}}
{{- /* Chart-managed provider config: auto-mount when the instance sets `config`. */ -}}
{{- $volumes := $spec.volumes | default list -}}
{{- $volumeMounts := $spec.volumeMounts | default list -}}
{{- $configName := printf "%s-%s-config" (include "ref.fullname" $) $instance -}}
{{- if and $spec.config (not $spec.configMountPath) -}}
  {{- fail (printf "providers.%s: config is set, so configMountPath must be set too" $instance) -}}
{{- end -}}
{{- if $spec.config -}}
  {{- $volumeMounts = append $volumeMounts (dict "name" (printf "%s-config" $instance) "mountPath" $spec.configMountPath "readOnly" true) -}}
  {{- $volumes = append $volumes (dict "name" (printf "%s-config" $instance) "configMap" (dict "name" $configName)) -}}
{{- end -}}
{{- /* Container env beats envFrom, so a values override cannot detach the mounted files. */ -}}
{{- $env := list -}}
{{- if and $spec.config $spec.configEnvVar -}}
  {{- $env = append $env (dict "name" $spec.configEnvVar "value" $spec.configMountPath) -}}
{{- end -}}
{{- if $.Values.celeryRoutes -}}
  {{- $volumeMounts = append $volumeMounts (fromYaml (include "ref.celeryRoutesVolumeMount" $)) -}}
  {{- $volumes = append $volumes (fromYaml (include "ref.celeryRoutesVolume" $)) -}}
  {{- $env = concat $env (fromYamlArray (include "ref.celeryRoutesEnv" $)) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ref.fullname" $ }}-{{ $instance }}
  {{- with $spec.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/component: {{ $instance }}
    {{- include "ref.labels" $ | nindent 4 }}
spec:
  {{- if not (include "ref.autoscalerEnabled" $spec) }}
  replicas: {{ $spec.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $instance }}
      {{- include "ref.selectorLabels" $ | nindent 6 }}
  template:
    metadata:
      annotations:
      {{- with $spec.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        {{- /* This instance's own Secret, so a change to another instance does not restart these pods.
               Rendered last, so a podAnnotations override cannot detach a pod from its rollout trigger. */}}
        checksum/config: {{ include "ref.providerSecret" (dict "root" $ "provider" $instance "spec" $spec) | sha256sum }}
        {{- if $spec.config }}
        checksum/configmap: {{ toYaml $spec.config | sha256sum }}
        {{- end }}
      labels:
        app.kubernetes.io/component: {{ $instance }}
        {{- include "ref.labels" $ | nindent 8 }}
        {{- with $spec.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "ref.serviceAccountName" (dict "root" $ "component" $instance "serviceAccount" $spec.serviceAccount)) }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $spec.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "ref.waitForDragonfly" $ }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
      - name: {{ $instance }}
        {{- with $spec.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: "{{ $spec.image.repository }}:{{ $spec.image.tag }}"
        imagePullPolicy: {{ $spec.image.pullPolicy }}
        args:
        {{- toYaml $args | nindent 8 }}
        {{- with $env }}
        env:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ include "ref.fullname" $ }}-{{ $instance }}
        {{- with $spec.extraEnvFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $spec.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- if and $spec.livenessProbe $spec.livenessProbe.enabled }}
        {{- $probe := $spec.livenessProbe }}
        {{- /* The solo pool runs tasks in the main thread, so a busy worker cannot answer the ping. */}}
        {{- if regexMatch "(^| )(-P|--pool)(=| )solo( |$)" (join " " $spec.extraArgs) }}
        {{- fail (printf "providers.%s: livenessProbe cannot be used with the solo pool" $instance) }}
        {{- end }}
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - 'celery -A climate_ref_celery.app inspect ping -d celery@$(hostname) -t {{ $probe.pingTimeoutSeconds }}'
          initialDelaySeconds: {{ $probe.initialDelaySeconds }}
          periodSeconds: {{ $probe.periodSeconds }}
          timeoutSeconds: {{ $probe.timeoutSeconds }}
          failureThreshold: {{ $probe.failureThreshold }}
        {{- end }}
        {{- with $volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $volumes }}
      volumes:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with $spec.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $spec.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $spec.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{ end -}}
