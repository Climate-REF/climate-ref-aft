{{- include "ref.validateOrchestrator" . -}}
{{- range $instance, $spec := (fromYaml (include "ref.workerInstances" .)) -}}
{{- $spec := include "ref.providerSpec" (dict "root" $ "spec" $spec) | fromYaml -}}
{{- $keda := $spec.keda | default dict -}}
{{- if $keda.enabled -}}
{{- if ($spec.autoscaling | default dict).enabled -}}
  {{- fail (printf "providers.%s: autoscaling.enabled and keda.enabled both set. Pick one, because two autoscalers on the same Deployment fight over its replica count." $instance) -}}
{{- end -}}
{{- /* The redis trigger goes inactive when the queue empties, not when the work finishes.
       Without a trigger that reports work in flight, only the cooldown protects a running diagnostic. */ -}}
{{- $env := fromYaml (include "ref.instanceEnv" (dict "root" $ "spec" $spec)) -}}
{{- $timeLimit := int ($env.CELERY_TASK_TIME_LIMIT | default 0) -}}
{{- $held := or ($keda.runningTasks | default dict).enabled $keda.extraTriggers -}}
{{- $cooldown := $keda.cooldownPeriod | default (ternary $timeLimit 1800 (and (not $held) (gt $timeLimit 1800))) -}}
{{- if and (not $held) (lt (int $cooldown) $timeLimit) -}}
  {{- fail (printf "providers.%s: keda.cooldownPeriod is %v, below this worker's CELERY_TASK_TIME_LIMIT of %v, so KEDA can scale it in while a diagnostic is still running. Raise keda.cooldownPeriod above that, or enable keda.runningTasks so a busy worker holds itself up." $instance $cooldown $timeLimit) -}}
{{- end -}}
{{- $queues := fromYamlArray (include "ref.instanceQueues" (dict "instance" $instance "spec" $spec)) -}}
{{- $address := include "ref.kedaRedisAddress" (dict "root" $ "keda" $keda) -}}
{{- $triggers := list -}}
{{- range $queue := $queues -}}
{{- $metadata := fromYaml (include "ref.kedaRedisMetadata" (dict "address" $address "queue" $queue "keda" $keda)) -}}
{{- $triggers = append $triggers (dict "type" "redis" "metadata" $metadata) -}}
{{- end -}}
{{- if ($keda.runningTasks | default dict).enabled -}}
{{- $running := $keda.runningTasks -}}
{{- /* Matches this instance's pods by Flower's own `worker` label, which is `celery@<pod>`.
       The trailing hash pair keeps `esmvaltool` from also matching `esmvaltool-large`. */ -}}
{{- $selector := printf "celery@%s-%s-[a-z0-9]+-[a-z0-9]+" (include "ref.fullname" $) $instance -}}
{{- $default := printf "sum(flower_worker_number_of_currently_executing_tasks{namespace=\"%s\", worker=~\"%s\"})" $.Release.Namespace $selector -}}
{{- $metadata := dict
      "serverAddress" (required (printf "providers.%s: keda.runningTasks.enabled needs keda.runningTasks.serverAddress" $instance) $running.serverAddress)
      "query" ($running.query | default $default)
      "threshold" ($running.threshold | toString) -}}
{{- $triggers = append $triggers (dict "type" "prometheus" "metadata" $metadata) -}}
{{- end -}}
{{- with $keda.extraTriggers -}}
{{- $triggers = concat $triggers . -}}
{{- end -}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "ref.fullname" $ }}-{{ $instance }}
  labels:
    app.kubernetes.io/component: {{ $instance }}
    {{- include "ref.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "ref.fullname" $ }}-{{ $instance }}
  minReplicaCount: {{ $keda.minReplicaCount }}
  maxReplicaCount: {{ $keda.maxReplicaCount }}
  cooldownPeriod: {{ $cooldown }}
  pollingInterval: {{ $keda.pollingInterval }}
  {{- with $keda.advanced }}
  advanced:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  triggers:
  {{- toYaml $triggers | nindent 2 }}
---
{{ end }}
{{- end -}}
