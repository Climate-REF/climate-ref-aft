{{- range $provider, $spec := (omit .Values.providers "defaults") -}}
{{- $spec := mergeOverwrite (deepCopy $.Values.defaults) $spec -}}
{{- /* A nulled env override reaches here as nil rather than an empty map. */ -}}
{{- if not (kindIs "map" $spec.env) -}}
  {{- $_ := set $spec "env" dict -}}
{{- end -}}
{{- /* Expand threadpoolLimit into the backend thread caps. Explicit env keys win. */ -}}
{{- if $spec.threadpoolLimit -}}
  {{- range $var := list "OMP_NUM_THREADS" "OPENBLAS_NUM_THREADS" "MKL_NUM_THREADS" "NUMEXPR_NUM_THREADS" "VECLIB_MAXIMUM_THREADS" "BLIS_NUM_THREADS" -}}
    {{- if not (hasKey $spec.env $var) -}}
      {{- $_ := set $spec.env $var (toString $spec.threadpoolLimit) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ref.fullname" $ }}-{{ $provider }}
  labels:
    app.kubernetes.io/component: {{ $provider }}
    {{- include "ref.labels" $ | nindent 4 }}
stringData:
  {{- tpl (toYaml $spec.env) $ | nindent 2}}
---
{{ end -}}
