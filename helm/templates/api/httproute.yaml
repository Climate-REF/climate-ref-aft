{{- if and .Values.api.enabled .Values.api.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ref.fullname" . }}-api
  labels:
    app.kubernetes.io/component: api
    {{- include "ref.labels" . | nindent 4 }}
    {{- with .Values.api.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.api.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /* A route with no parentRefs renders happily but attaches to no Gateway, so refuse it. */}}
  parentRefs:
    {{- toYaml (required "api.httpRoute.enabled is set, so api.httpRoute.parentRefs must name the Gateway to attach to" .Values.api.httpRoute.parentRefs) | nindent 4 }}
  {{- with .Values.api.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    {{- with .Values.api.httpRoute.filters }}
    filters:
      {{- toYaml . | nindent 4 }}
    {{- end }}
    backendRefs:
    - name: {{ include "ref.fullname" . }}-api
      port: {{ .Values.api.service.port }}
{{- end }}
