{{- if .Values.api.enabled -}}
{{- $volumes := .Values.api.volumes | default .Values.defaults.volumes | default list -}}
{{- $volumeMounts := .Values.api.volumeMounts | default .Values.defaults.volumeMounts | default list -}}
{{- /* The API constructs the Celery executor when it triggers a solve, so it needs the routing table. */ -}}
{{- if .Values.celeryRoutes -}}
  {{- $volumeMounts = append $volumeMounts (dict "name" "celery-routes" "mountPath" "/etc/climate-ref/routes" "readOnly" true) -}}
  {{- $volumes = append $volumes (dict "name" "celery-routes" "configMap" (dict "name" (printf "%s-celery-routes" (include "ref.fullname" .)))) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ref.fullname" . }}-api
  labels:
    app.kubernetes.io/component: api
    {{- include "ref.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      {{- include "ref.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api/secret.yaml") . | sha256sum }}
      {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/component: api
        {{- include "ref.labels" . | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.api.serviceAccount .Values.api.serviceAccount.name }}
      serviceAccountName: {{ .Values.api.serviceAccount.name }}
      {{- else if and .Values.api.serviceAccount .Values.api.serviceAccount.create }}
      serviceAccountName: {{ include "ref.fullname" . }}-api
      {{- end }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: api
        {{- with .Values.api.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        {{- if .Values.celeryRoutes }}
        env:
        - name: REF_CELERY_ROUTES
          value: /etc/climate-ref/routes/routes.toml
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ include "ref.fullname" . }}-api
        {{- with .Values.api.extraEnvFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /api/v1/utils/health-check/
            port: http
        {{- with .Values.api.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with $volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- with $volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
