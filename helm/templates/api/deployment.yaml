{{- if .Values.api.enabled -}}
{{- $volumes := .Values.api.volumes | default .Values.defaults.volumes | default list -}}
{{- $volumeMounts := .Values.api.volumeMounts | default .Values.defaults.volumeMounts | default list -}}
{{- /* The API constructs the Celery executor when it triggers a solve, so it needs the routing table. */ -}}
{{- if .Values.celeryRoutes -}}
  {{- $volumeMounts = append $volumeMounts (fromYaml (include "ref.celeryRoutesVolumeMount" .)) -}}
  {{- $volumes = append $volumes (fromYaml (include "ref.celeryRoutesVolume" .)) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ref.fullname" . }}-api
  labels:
    app.kubernetes.io/component: api
    {{- include "ref.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      {{- include "ref.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api/secret.yaml") . | sha256sum }}
        {{- with .Values.celeryRoutes }}
        checksum/celery-routes: {{ . | sha256sum }}
        {{- end }}
      {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/component: api
        {{- include "ref.labels" . | nindent 8 }}
        {{- with (include "ref.podLabels" .) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (include "ref.serviceAccountName" (dict "root" . "component" "api" "serviceAccount" .Values.api.serviceAccount)) }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.api.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: api
        {{- with .Values.api.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        {{- if .Values.celeryRoutes }}
        env:
        {{- include "ref.celeryRoutesEnv" . | nindent 8 }}
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ include "ref.fullname" . }}-api
        {{- with .Values.api.extraEnvFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /api/v1/utils/health-check/
            port: http
        {{- with .Values.api.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with $volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- with $volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
