{{- /* Migrations write the database the orchestrator then uses, so the Job takes the
       orchestrator's settings throughout. Splitting env from volumes here would let a
       migration run against a different database than the one the app talks to. */ -}}
{{- $migrate := include "ref.providerSpec" (dict "root" . "spec" (omit (.Values.orchestrator | default dict) "enabled" "resources")) | fromYaml -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ref.fullname" . }}-migrate
  labels:
    {{- include "ref.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
stringData:
  {{- include "ref.instanceEnv" (dict "root" . "spec" $migrate) | nindent 2 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ref.fullname" . }}-migrate
  labels:
    {{- include "ref.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "ref.selectorLabels" . | nindent 8 }}
        {{- with (include "ref.podLabels" .) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with $migrate.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with $migrate.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
      - name: migrate
        image: "{{ $migrate.image.repository }}:{{ $migrate.image.tag }}"
        imagePullPolicy: {{ $migrate.image.pullPolicy }}
        command: ["ref", "db", "migrate"]
        {{- with $migrate.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ include "ref.fullname" . }}-migrate
        {{- with $migrate.extraEnvFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.migrate.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $migrate.volumeMounts }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with $migrate.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $migrate.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $migrate.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $migrate.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
