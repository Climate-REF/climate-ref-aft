imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

api:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/climate-ref/climate-ref-frontend
    pullPolicy: IfNotPresent
    tag: v0.4.2

  env:
    ENVIRONMENT: production
    LOG_LEVEL: INFO
    REF_CONFIGURATION: /ref
    REF_DIAGNOSTIC_PROVIDERS: climate_ref_esmvaltool:provider,climate_ref_ilamb:provider,climate_ref_pmp:provider

  ingress:
    enabled: false
    host:
    className: ""
    annotations: {}
    labels: {}

  httpRoute:
    enabled: false
    hostnames: []
    parentRefs: []
    annotations: {}
    labels: {}
    # Gateway API filters applied to the route's single rule,
    # e.g. a Traefik Middleware ExtensionRef for forward-auth.
    filters: []

  serviceAccount:
    create: true
    automount: false
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  securityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  service:
    type: ClusterIP
    port: 80

  # The API eagerly imports all diagnostic providers (esmvaltool/ilamb/pmp)
  # at startup, which needs well over 512Mi.
  # The limit is headroom for request handling, not a steady state.
  resources:
    requests:
      cpu: 200m
      memory: 2Gi
    limits:
      memory: 6Gi

  # Additional envFrom sources, appended after the chart's own Secret,
  # so they win on any key both define.
  # This is how a value that must not sit in values.yaml, such as a database URL,
  # reaches the container.
  extraEnvFrom: []

  # Scheduling priority for the API pods.
  # Set this above the workers' class, so a full cluster evicts a diagnostic worker rather than the API.
  priorityClassName: ""

  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Celery broker to use when the bundled Dragonfly subchart is disabled.
# Required when dragonfly.enabled is false, ignored otherwise.
externalBroker:
  url: ""

# Celery queue routing table, written verbatim as TOML to a ConfigMap
# and exposed to the API and every worker via REF_CELERY_ROUTES.
# This places each execution on a queue such as esmvaltool-large,
# so differently sized worker instances (see `queues` under `defaults`) can consume them.
# See https://climate-ref.readthedocs.io/en/latest/configuration/ for the file format.
# Requires climate-ref v0.17.0 or newer. Older releases ignore the variable
# and keep sending every execution to the bare provider queue.
# Empty disables routing entirely.
#
# Example:
#   celeryRoutes: |
#     [esmvaltool]
#     default = "esmvaltool-medium"
#     rules = [
#       { match = "portrait-*", queue = "esmvaltool-large" },
#     ]
celeryRoutes: ""

dragonfly:
  enabled: true
  storage:
    enabled: true

  # Requests match limits so the broker is the last pod evicted when a node is under pressure.
  # Losing it strands every running execution.
  resources:
    requests:
      cpu: 4
      memory: 6Gi
    limits:
      cpu: 4
      memory: 6Gi

  # maxmemory sits below the pod limit, so Dragonfly evicts before the kernel OOM-kills it.
  # Dragonfly counts its io threads from the CPU limit and requires 256MiB of maxmemory per thread,
  # so lowering maxmemory without lowering the CPU limit makes it refuse to start.
  extraArgs:
  - --maxmemory=4Gi

flower:
  env:
    CELERY_BROKER_URL: '{{ include "ref.brokerUrl" . }}'
    CELERY_RESULT_BACKEND: '{{ include "ref.brokerUrl" . }}'

  # Additional Celery configuration for Flower (rendered as celeryconfig.py)
  # Use this for settings that cannot be set via environment variables
  celeryConfig: |
    import json

    from kombu.serialization import register

    # The Flower image does not have climate_ref_celery, so it cannot use the real codec.
    # Flower only displays payloads, so it reads the wire form as plain JSON
    # instead of rebuilding the REF objects.
    register(
        "ref-json",
        encoder=json.dumps,
        decoder=json.loads,
        content_type="application/x-ref-json",
        content_encoding="utf-8",
    )

    accept_content = ['application/json', 'application/x-ref-json', 'application/x-python-serialize']
    result_accept_content = accept_content

  ingress:
    enabled: false
    host:
    className: ""
    annotations: {}
    labels: {}

  httpRoute:
    enabled: false
    hostnames: []
    parentRefs: []
    annotations: {}
    labels: {}
    # Gateway API filters applied to the route's single rule,
    # e.g. a Traefik Middleware ExtensionRef for forward-auth.
    filters: []

  serviceMonitor:
    enabled: false

  replicaCount: 1

  image:
    repository: mher/flower
    pullPolicy: IfNotPresent
    tag: 2.0.1

  serviceAccount:
    create: true
    automount: false
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  securityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  service:
    type: ClusterIP
    port: 5555

  # Flower only reads worker events and serves a small web UI.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  nodeSelector: {}
  tolerations: []
  affinity: {}

# A mapping of name: size for PVCs to create. Name will be prepended with release name.
# Not mounted unless specified in volumes and volumeMounts arrays
createPVCs: {}

defaults:
  env:
    CELERY_BROKER_URL: '{{ include "ref.brokerUrl" . }}'
    CELERY_RESULT_BACKEND: '{{ include "ref.brokerUrl" . }}'
    REF_EXECUTOR: climate_ref_celery.executor.CeleryExecutor
    REF_CONFIGURATION: /ref
    REF_SOFTWARE_ROOT: /ref/software
    # The three providers the Assessment Fast Track evaluates.
    # Unset, the REF instead runs every provider installed in the image, including the example one.
    REF_DIAGNOSTIC_PROVIDERS: climate_ref_esmvaltool:provider,climate_ref_ilamb:provider,climate_ref_pmp:provider
    # Set HOME to writable location to fix intake-esgf and ilamb3 config directory creation
    HOME: /tmp
    # Celery reliability tuning (uncomment to override base.py defaults)
    # CELERY_TASK_TIME_LIMIT: "21600"          # Hard kill after 6 hours
    # CELERY_TASK_SOFT_TIME_LIMIT: "19800"     # Soft limit at 5.5 hours
    # CELERY_VISIBILITY_TIMEOUT: "21900"       # Must be above CELERY_TASK_TIME_LIMIT
    # CELERY_WORKER_PREFETCH_MULTIPLIER: "1"
    # CELERY_RESULT_EXPIRES: "172800"          # 48 hours
    # CELERY_WORKER_MAX_TASKS_PER_CHILD: "50"  # Recycle workers to prevent memory leaks
    # CELERY_WORKER_MAX_MEMORY_PER_CHILD: "2097152"  # 2 GB cap per worker process (in KB)
    # CELERY_TASK_COMPRESSION: "gzip"          # Set to "" to send uncompressed task bodies
    # CELERY_RESULT_COMPRESSION: "gzip"        # Set to "" to store uncompressed results
    # Comma separated, and only needed while draining pickled messages from a previous release.
    # Accepting pickle lets anything that can write to the broker run code in a worker.
    # CELERY_ACCEPT_CONTENT: "json,ref-json,pickle"

  # Ignored once `autoscaling` or `keda` is enabled, because the autoscaler owns the replica count.
  replicaCount: 1

  # Provider this worker runs, passed as `--provider`.
  # Defaults to the instance name, so a plain `esmvaltool:` instance needs nothing here.
  # Setting it decouples the two,
  # allowing several differently sized instances of one provider,
  # e.g. an `esmvaltool-large` instance with `provider: esmvaltool`.
  # The name `orchestrator` is special and runs the default worker without a provider.
  provider: null

  # Celery queues this worker consumes, replacing the provider's default queue.
  # Use together with `celeryRoutes` to give each size class its own worker pool.
  # Every queue the routing table can produce must appear in some instance's list,
  # because a task sent to a queue with no consumer waits forever.
  # Include the bare provider queue somewhere while older executions are still draining.
  queues: []

  # Number of Celery worker child processes per pod (passed as `--concurrency`).
  # One per pod, because no provider bounds its own memory use,
  # so the pod limit is the only thing holding a diagnostic down.
  # A single ILAMB execution can peak near 40Gi, and two of those do not fit in one pod.
  # Scale throughput with `replicaCount` rather than by raising this.
  # Set to null to use Celery's default of one process per CPU core.
  concurrency: 1

  # Additional arguments appended to the Celery worker after the `--` separator,
  # for options not exposed as first-class values (e.g. ["--pool=solo"]).
  extraArgs: []

  # Liveness probe that pings the worker's own Celery consumer loop,
  # so a worker that has stopped consuming is restarted rather than left reporting Ready.
  # A failing probe destroys the execution the worker was running,
  # so the timings must suit how long this provider's diagnostics take.
  # Cannot be combined with `--pool=solo`, which blocks the control loop while a task runs,
  # so every busy worker would be restarted.
  livenessProbe:
    enabled: false
    initialDelaySeconds: 600
    periodSeconds: 120
    timeoutSeconds: 60
    failureThreshold: 3
    # Timeout passed to `celery inspect ping`.
    # Keep it below timeoutSeconds so celery reports the failure itself before the kubelet kills the probe.
    pingTimeoutSeconds: 30

  image:
    repository: ghcr.io/climate-ref/climate-ref
    pullPolicy: IfNotPresent
    tag: v0.17.2

  annotations: {}

  serviceAccount:
    create: true
    automount: false
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  securityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  # The floor for running a single diagnostic, not a tuned figure.
  # Most diagnostics settle around 10Gi to 15Gi, so a smaller pod gets OOM-killed part way through.
  # The limit is the headroom for the outliers, and each provider raises it to suit its own worst case.
  # A cluster too small for these is too small to run a diagnostic at all.
  resources:
    requests:
      cpu: 4
      memory: 16Gi
    limits:
      cpu: 6
      memory: 32Gi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  # Scale the worker on broker queue depth through KEDA, down to zero when its queues are empty.
  # Needs KEDA in the cluster, and cannot be combined with `autoscaling`.
  keda:
    enabled: false

    # Zero means the worker only exists while there is something for it to do.
    minReplicaCount: 0
    maxReplicaCount: 4

    # Seconds at zero queue depth before scaling in.
    # Empty tracks this worker's own CELERY_TASK_TIME_LIMIT, because the queue empties
    # before the diagnostic finishes. Anything shorter needs `runningTasks`.
    cooldownPeriod: ""
    pollingInterval: 15

    # Broker for the queue-depth triggers, as `host:port`.
    # Defaults to the bundled Dragonfly, fully qualified because the scaler dials from KEDA's namespace.
    # Required when `dragonfly.enabled` is false, because the scaler cannot use externalBroker.url.
    redisAddress: ""

    # One pending task is enough to want a worker, and the pod runs one execution at a time.
    listLength: "1"

    # Merged over every redis trigger, for the scaler options the chart does not name,
    # e.g. `enableTLS`, `databaseIndex`, `passwordFromEnv`.
    redisMetadata: {}

    # A second trigger that holds the worker up while it is still executing.
    # `query` defaults to this instance's own pods, matched on the `worker` label Flower already emits.
    runningTasks:
      enabled: false
      serverAddress: ""
      query: ""
      threshold: "1"

    # Raw KEDA `advanced` block. Its `horizontalPodAutoscalerConfig.behavior`
    # is the only way to tune how sharply the scale-down happens.
    advanced: {}

    # Raw KEDA triggers appended to the generated ones.
    extraTriggers: []

  # Scheduling priority for the worker pods and the db-migrate hook, overridable per instance.
  # A preempted execution is retried, so workers usually sit below the API.
  priorityClassName: ""

  # As api.extraEnvFrom, applied to every worker and to the db-migrate hook.
  extraEnvFrom: []

  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The orchestrator is the Celery worker that consumes the default `celery` queue.
# It takes the same keys as an entry under `providers`, layered over `defaults` the same way,
# but it is its own block because its access to `/ref` is wider than a diagnostic worker's.
# It is the only pod that runs `ref providers setup`, so it alone writes `/ref/software`,
# and it runs the `handle_result` task that copies `/ref/scratch` into `/ref/results`.
# See "Required volumes" in README.md for the access split this implies.
orchestrator:
  enabled: true

  # The orchestrator queues and tracks executions rather than running them,
  # so it needs far less than a diagnostic worker.
  resources:
    requests:
      cpu: 1
      memory: 2Gi
    limits:
      cpu: 2
      memory: 8Gi

  # `volumes` and `volumeMounts` are deliberately absent, so the orchestrator
  # inherits `defaults`. Setting them to [] here would replace the inherited
  # lists with nothing and leave the pod without its /ref mount.
  # Set them to give the orchestrator the RW mounts that `providers setup` and
  # `handle_result` need while the diagnostic workers keep a narrower view of the same PVC.

# Map of instances to deploy, where the key is the instance name and the value
# is any provider-specific overrides.
#
#  If no overrides are provided, the provider will be deployed with the defaults above.
#
# Each provider carries the pod size and time limit its own diagnostics need.
# CELERY_VISIBILITY_TIMEOUT must stay above CELERY_TASK_TIME_LIMIT, not merely equal to it.
# task_acks_late means the worker stores the timeout result before it acknowledges the task,
# and an equal window lets the broker redeliver during that gap, so the task executes twice.
providers:
  esmvaltool:
    # An execution fans out across its own Dask cluster (see `config` below),
    # so the pod holds every one of those workers at once.
    # This is the largest footprint of the three providers, and its diagnostics run for hours.
    resources:
      requests:
        cpu: 4
        memory: 16Gi
      limits:
        cpu: 8
        memory: 40Gi
    env:
      CELERY_TASK_TIME_LIMIT: "21600"          # 6 hours
      CELERY_TASK_SOFT_TIME_LIMIT: "19800"     # 5.5 hours
      CELERY_VISIBILITY_TIMEOUT: "21900"     # 5 minutes past the hard limit
    # Esmvalcore configuration written to a ConfigMap and mounted at configMountPath/config.yaml,
    # with configEnvVar set on the worker container so esmvalcore reads it.
    # Without this, esmvalcore auto-detects all available cores and causes OOMs.
    # Set `config: null` to opt out and provide your own config
    # via `volumes`/`volumeMounts` + ESMVALTOOL_CONFIG_DIR in `env`.
    # Removing the key from an override has no effect, because this default stays in place.
    # Any provider can carry a `config` this way. `configMountPath` is required alongside it,
    # and `configEnvVar` is optional, for tools that locate their config through the environment.
    configMountPath: /etc/esmvaltool
    configEnvVar: ESMVALTOOL_CONFIG_DIR
    config:
      max_parallel_tasks: 2
      dask:
        use: local_distributed
        profiles:
          local_distributed:
            cluster:
              type: distributed.LocalCluster
              n_workers: 2
              threads_per_worker: 2
              memory_limit: 4GiB
  pmp:
    # A PDO execution holds around 15Gi, which is what sets the request.
    resources:
      requests:
        cpu: 4
        memory: 16Gi
      limits:
        cpu: 6
        memory: 32Gi
    env:
      CELERY_TASK_TIME_LIMIT: "7200"           # 2 hours
      CELERY_TASK_SOFT_TIME_LIMIT: "6600"      # 1 hour 50 minutes
      CELERY_VISIBILITY_TIMEOUT: "7500"      # 5 minutes past the hard limit
      # PMP recommends the synchronous Dask scheduler when running multiple executions on the same machine.
      # The threaded scheduler crashes under excessive parallelism. See Climate-REF/climate-ref#437 and
      # https://climate-ref.readthedocs.io/en/latest/how-to-guides/control-memory-use/
      DASK_SCHEDULER: synchronous
  ilamb:
    # ILAMB diagnostics finish quickly, but a few are very memory hungry.
    # lai-avh15c1 peaks near 39Gi on its own, so the limit is well above the request.
    resources:
      requests:
        cpu: 4
        memory: 16Gi
      limits:
        cpu: 6
        memory: 48Gi
    env:
      CELERY_TASK_TIME_LIMIT: "1800"           # 30 minutes
      CELERY_TASK_SOFT_TIME_LIMIT: "1500"      # 25 minutes
      CELERY_VISIBILITY_TIMEOUT: "2100"      # 5 minutes past the hard limit
      # ILAMB/IOMB diagnostics are restricted to the synchronous Dask scheduler upstream.
      # Setting it explicitly is harmless and matches the documented recommendation.
      DASK_SCHEDULER: synchronous
