api:
  # The API starts and answers a health check here, it does not serve real traffic.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  env:
    SECRET_KEY: ci-test-secret
    # Diagnostic providers (climate_ref_ilamb / esmvaltool) create config
    # dirs under $HOME at import time, which fails with the api's
    # readOnlyRootFilesystem unless HOME points at a writable mount.
    HOME: /tmp
  volumes:
  - name: gha-cached
    hostPath:
      path: /cache/ref-config
  - name: tmp
    emptyDir: {}
  volumeMounts:
  - name: gha-cached
    mountPath: /ref
    readOnly: true
  - name: tmp
    mountPath: /tmp

service:
  type: NodePort

flower:
  podSecurityContext:
    runAsUser: 1000

defaults:
  podSecurityContext:
    runAsUser: 1000

  # The chart defaults size a pod for a real diagnostic, which no CI runner has.
  # These pods only need to start and answer a ping.
  # Each provider is given the same block below, because a provider's own resources win over the defaults.
  resources: &testResources
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  volumes:
  - name: gha-cached
    hostPath:
      path: /cache/ref-config
  - name: tmp
    emptyDir: {}
  volumeMounts:
  - name: gha-cached
    mountPath: /ref
    readOnly: false
  - name: tmp
    mountPath: /tmp
    readOnly: false

providers:
  orchestrator:
    resources: *testResources
  esmvaltool:
    resources: *testResources
  pmp:
    resources: *testResources
  ilamb:
    resources: *testResources

dragonfly:
  # Only the requests are lowered, so the pod schedules on a CI node.
  # Dragonfly sizes itself against the cgroup limit and exits if that limit crowds --maxmemory,
  # so the chart's own limit is left in place.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  extraArgs:
  - --proactor_threads=1
  - --maxmemory=256mb
