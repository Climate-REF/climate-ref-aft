api:
  # The API starts and answers a health check here, it does not serve real traffic.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  env:
    # Diagnostic providers (climate_ref_ilamb / esmvaltool) create config
    # dirs under $HOME at import time, which fails with the api's
    # readOnlyRootFilesystem unless HOME points at a writable mount.
    HOME: /tmp
  volumes:
  - name: gha-cached
    hostPath:
      path: /cache/ref-config
  - name: tmp
    emptyDir: {}
  volumeMounts:
  - name: gha-cached
    mountPath: /ref
    readOnly: true
  - name: tmp
    mountPath: /tmp

flower:
  podSecurityContext:
    runAsUser: 1000

defaults:
  podSecurityContext:
    runAsUser: 1000

  # The chart defaults size a pod for a real diagnostic, which no CI runner has.
  # The e2e solve runs one small diagnostic per provider on sample data,
  # so the pods need enough to run that, not a production workload.
  # A provider's own resources win over the defaults,
  # so each provider that needs nothing special reuses this block below.
  resources: &testResources
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  # Diagnostic workers read the config and the conda envs, and write only scratch.
  # `/ref/scratch` has to stay shared with the orchestrator.
  volumes:
  - name: gha-cached
    hostPath:
      path: /cache/ref-config
  - name: tmp
    emptyDir: {}
  volumeMounts:
  - name: gha-cached
    mountPath: /ref
    readOnly: true
  - name: gha-cached
    mountPath: /ref/scratch
    subPath: scratch
    readOnly: false
  - name: gha-cached
    mountPath: /ref/cache/mamba
    subPath: cache/mamba
    readOnly: false
  - name: gha-cached
    mountPath: /ref/log
    subPath: log
    readOnly: false
  - name: tmp
    mountPath: /tmp
    readOnly: false

# The orchestrator runs `providers setup` and copies scratch into results,
# so it is the one worker that needs the whole tree writable.
orchestrator:
  resources: *testResources
  volumes:
  - name: gha-cached
    hostPath:
      path: /cache/ref-config
  - name: tmp
    emptyDir: {}
  volumeMounts:
  - name: gha-cached
    mountPath: /ref
    readOnly: false
  - name: tmp
    mountPath: /tmp
    readOnly: false

providers:
  esmvaltool:
    # The chart's default config starts a Dask cluster of 2 workers with a 4GiB limit each,
    # which believes it has 8GiB inside the 1Gi test pod.
    # A killed Dask worker leaves ESMValCore hanging silently between tasks,
    # which is what intermittently stalled the e2e solve past its timeout.
    # This gives the pod room for one execution and a Dask config that fits inside it.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 3Gi
    # Only the leaves that differ from the chart default, helm deep-merges the rest.
    config:
      max_parallel_tasks: 1
      dask:
        profiles:
          local_distributed:
            cluster:
              n_workers: 1
              memory_limit: 1GiB
  pmp:
    resources: *testResources
  ilamb:
    resources: *testResources

dragonfly:
  # Dragonfly counts its io threads from the CPU limit and demands 256MiB of maxmemory per thread,
  # so the CPU limit has to come down alongside maxmemory or it refuses to start.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  extraArgs:
  - --proactor_threads=1
  - --maxmemory=512mb
