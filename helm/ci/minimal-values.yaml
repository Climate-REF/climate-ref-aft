# Minimal values for testing a fresh deployment with no pre-existing state.
# Verifies that workers, dragonfly, and flower start with just env var config.
#
# The API is disabled here: ref-app eagerly imports diagnostic providers at
# startup, which requires a populated /ref/software (created by
# `ref providers setup`). That setup is exercised by the full helm test, not
# this minimal smoke test.

api:
  enabled: false

defaults:
  # The chart defaults size a pod for a real diagnostic, which no CI runner has.
  # Each provider is given the same block below, because a provider's own resources win over the defaults.
  resources: &testResources
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi

  volumes:
  - name: ref-data
    emptyDir: {}
  - name: tmp
    emptyDir: {}

  volumeMounts:
  - name: ref-data
    mountPath: /ref
  - name: tmp
    mountPath: /tmp

providers:
  orchestrator:
    resources: *testResources
  esmvaltool:
    resources: *testResources
  pmp:
    resources: *testResources
  ilamb:
    resources: *testResources

dragonfly:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  extraArgs:
  - --proactor_threads=1
  - --maxmemory=256mb
