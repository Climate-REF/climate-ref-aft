# Local testing values for climate-ref helm chart

defaults:
  image:
    repository: ghcr.io/climate-ref/climate-ref
    pullPolicy: IfNotPresent
    tag: latest

  # The chart defaults size a pod for a real diagnostic, which a laptop cluster cannot fit.
  # Each provider is given the same block below, because a provider's own resources win over the defaults.
  resources: &testResources
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi

  podSecurityContext:
    runAsUser: 1000

  # Set HOME to writable location to fix intake-esgf and ilamb3 config directory issues
  env:
    HOME: /tmp

  volumes:
  - name: test-data
    emptyDir: {}
  - name: tmp
    emptyDir: {}

  volumeMounts:
  - name: test-data
    mountPath: /ref
    readOnly: false
  - name: tmp
    mountPath: /tmp
    readOnly: false

flower:
  # Fix runAsNonRoot issue with flower image
  securityContext:
    runAsNonRoot: false

dragonfly:
  storage:
    enabled: false  # Use emptyDir for local testing
  # Only the requests are lowered, so the pod schedules on a small cluster.
  # Dragonfly sizes itself against the cgroup limit and exits if that limit crowds --maxmemory,
  # so the chart's own limit is left in place.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  extraArgs:
  - --proactor_threads=1
  - --maxmemory=512mb

# Enable all providers for testing
providers:
  orchestrator:
    resources: *testResources
  esmvaltool:
    resources: *testResources
  pmp:
    resources: *testResources
  ilamb:
    resources: *testResources

api:
  image:
    tag: latest
  env:
    ENVIRONMENT: local
    SECRET_KEY: local-test-secret
    REF_DATABASE_URL: sqlite:////tmp/ref.db
    REF_CONFIGURATION: /ref
  volumes:
  - name: tmp
    emptyDir: {}
  volumeMounts:
  - name: tmp
    mountPath: /tmp
    readOnly: false
