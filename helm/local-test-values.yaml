# Local testing values for climate-ref helm chart

defaults:
  image:
    repository: ghcr.io/climate-ref/climate-ref
    pullPolicy: IfNotPresent
    tag: latest

  podSecurityContext:
    runAsUser: 1000

  # Set HOME to writable location to fix intake-esgf and ilamb3 config directory issues
  env:
    HOME: /tmp

  volumes:
  - name: test-data
    emptyDir: {}
  - name: tmp
    emptyDir: {}

  volumeMounts:
  - name: test-data
    mountPath: /ref
    readOnly: false
  - name: tmp
    mountPath: /tmp
    readOnly: false

flower:
  # Fix runAsNonRoot issue with flower image
  securityContext:
    runAsNonRoot: false

dragonfly:
  storage:
    enabled: false  # Use emptyDir for local testing
  extraArgs:
  - --proactor_threads=1
  - --maxmemory=512mb

# Enable all providers for testing
providers:
  orchestrator: {}
  esmvaltool: {}
  pmp: {}
  ilamb: {}

api:
  image:
    tag: latest
  env:
    ENVIRONMENT: local
    SECRET_KEY: local-test-secret
    REF_DATABASE_URL: sqlite:////tmp/ref.db
    REF_CONFIGURATION: /ref
  volumes:
  - name: tmp
    emptyDir: {}
  volumeMounts:
  - name: tmp
    mountPath: /tmp
    readOnly: false
